name = "voxshelf-ratings"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Permanent address for the app; the workers.dev address keeps working for older installs.
routes = [{ pattern = "api.voxshelf.app", custom_domain = true }]

[vars]
GITHUB_REPO = "ezlabs/voxshelf-reports"  # private: problem reports can include listener notes

[[d1_databases]]
binding = "DB"
database_name = "voxshelf-ratings"
database_id = "5c081283-d64f-4871-bcc1-ffb27db02882"

[[r2_buckets]]
binding = "COVERS"
bucket_name = "voxshelf-covers"

# At most 10 ratings a minute from one internet address (Cloudflare only allows 10s or 60s windows).
[[ratelimits]]
name = "RATINGS_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
