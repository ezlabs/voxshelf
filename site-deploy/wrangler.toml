# The voxshelf.app website: the static files in ../site, served by Cloudflare.
name = "voxshelf-site"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "voxshelf.app", custom_domain = true },
  { pattern = "www.voxshelf.app", custom_domain = true },
]

[assets]
directory = "../site"
not_found_handling = "404-page"
