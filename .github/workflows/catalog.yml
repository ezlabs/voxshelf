name: Nightly catalog

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch LibriVox catalog
        run: python catalog/fetch_catalog.py catalog/raw
      - name: Get previous catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download catalog -D prev -p catalog.db.gz -p manifest.json || echo "No previous catalog"
          if [ -f prev/catalog.db.gz ]; then gunzip prev/catalog.db.gz; fi
      - name: Build phone catalog and changes
        run: |
          VERSION=$(date -u +%Y%m%d)
          mkdir -p out
          python catalog/build_catalog.py catalog/raw out/catalog.db "$VERSION"
          python catalog/diff_catalog.py prev/catalog.db out/catalog.db out "$VERSION" prev/manifest.json
          gzip -9 out/catalog.db
      - name: Publish to the "catalog" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Latest catalog" --notes "Rebuilt nightly from the LibriVox API."
          gh release upload catalog out/* --clobber
          keep=$(python -c "import json;print(' '.join(c['file'] for c in json.load(open('out/manifest.json'))['changes']))")
          for asset in $(gh release view catalog --json assets --jq '.assets[].name' | grep '^changes-'); do
            case " $keep " in *" $asset "*) ;; *) gh release delete-asset catalog "$asset" -y ;; esac
          done
