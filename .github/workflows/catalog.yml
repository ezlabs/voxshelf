name: Nightly catalog

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch LibriVox catalog
        run: python catalog/fetch_catalog.py catalog/raw
      - name: Fetch Internet Archive download counts
        run: python catalog/fetch_popularity.py catalog/popularity.json
      - name: Get previous catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download catalog -D prev -p catalog.db.gz -p manifest.json -p openlibrary.json -p uploaded.txt || echo "No previous catalog"
          if [ -f prev/catalog.db.gz ]; then gunzip -k prev/catalog.db.gz; fi
      - name: Fetch Open Library ratings (a slice each night)
        run: |
          if [ -f prev/openlibrary.json ]; then cp prev/openlibrary.json catalog/openlibrary.json; fi
          if [ -f prev/catalog.db ]; then python catalog/fetch_openlibrary.py prev/catalog.db catalog/openlibrary.json 1500; fi
      - name: Build phone catalog and changes
        run: |
          VERSION=$(date -u +%Y%m%d)
          mkdir -p out
          python catalog/build_catalog.py catalog/raw out/catalog.db "$VERSION" catalog/popularity.json catalog/openlibrary.json
          python catalog/diff_catalog.py prev/catalog.db out/catalog.db out "$VERSION" prev/manifest.json
      - name: Shrink and upload covers for new recordings
        env:
          COVER_UPLOAD_KEY: ${{ secrets.COVER_UPLOAD_KEY }}
        run: |
          if [ -z "$COVER_UPLOAD_KEY" ]; then echo "No upload key; skipping covers"; exit 0; fi
          pip install pillow
          if [ -f prev/uploaded.txt ]; then cp prev/uploaded.txt catalog/uploaded.txt; fi
          python catalog/fetch_covers.py out/catalog.db covers catalog/uploaded.txt
          python catalog/upload_covers.py covers catalog/uploaded.txt
          cp catalog/uploaded.txt out/uploaded.txt
      - name: Compress catalog
        run: |
          gzip -9 out/catalog.db
          cp catalog/openlibrary.json out/openlibrary.json 2>/dev/null || true
      - name: Publish to the "catalog" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Latest catalog" --notes "Rebuilt nightly from the LibriVox API."
          gh release upload catalog out/* --clobber
          keep=$(python -c "import json;print(' '.join(c['file'] for c in json.load(open('out/manifest.json'))['changes']))")
          for asset in $(gh release view catalog --json assets --jq '.assets[].name' | grep '^changes-'); do
            case " $keep " in *" $asset "*) ;; *) gh release delete-asset catalog "$asset" -y ;; esac
          done
